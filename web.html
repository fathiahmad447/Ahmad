<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Glass Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <article class="card">

      <div class="card-image">
        <img
          src=""
          alt="Beautiful mountain landscape"
        >
        <div class="image-overlay"></div>

        <span class="badge">✦ PREMIUM</span>

        <button class="heart" aria-label="Favorite">♡</button>
      </div>

      <div class="card-content">
        <p class="eyebrow">DISCOVER SOMETHING BEAUTIFUL</p>

        <h1>Beyond<br><span>Ordinary.</span></h1>

        <p class="description">
          Experience a world where elegance, adventure and imagination
          come together in one unforgettable moment.
        </p>

        <div class="details">
          <div>
            <strong>01</strong>
            <span>Unique</span>
          </div>

          <div>
            <strong>∞</strong>
            <span>Inspired</span>
          </div>

          <div>
            <strong>24/7</strong>
            <span>Explore</span>
          </div>
        </div>

        <a href="#" class="button">
          Explore Now
          <span>↗</span>
        </a>
      </div>

      <div class="glow glow-one"></div>
      <div class="glow glow-two"></div>

    </article>
  </main>

</body>
</html>
